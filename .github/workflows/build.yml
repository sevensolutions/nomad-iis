name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - "LICENSE"
      - "README.md"
      - "SECURITY.md"
      - "CONTRIBUTING.md"
      - "CODE_OF_CONDUCT.md"
      - "website/**"
  # Allows you to run this workflow manually from the Actions tab.
  workflow_dispatch:
    inputs:
      release:
        description: "Create a GitHub Release from this build"
        type: boolean
        default: false
      version:
        description: "Version for the release (must match PluginInfo.cs). Required when release=true."
        required: false

jobs:
  build:
    runs-on: windows-latest

    strategy:
      matrix:
        profile:
          - publishProfile: "Release.pubxml"
            artifactName: "nomad_iis"
          - publishProfile: "ReleaseWithMgmtApi.pubxml"
            artifactName: "nomad_iis_mgmt_api"

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # Install the .NET Core workload
    - name: Install .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    # Extract and publish version
    - name: extract version
      run: |
        Get-Content "./src/NomadIIS/PluginInfo.cs" | Select-String 'public static readonly string Version = "([0-9]+\.[0-9]+\.[0-9])";' | ForEach-Object {
          $version = $_.Matches[0].Groups[1].Value
        }
        $version | Out-File -Path version -NoNewline
    - name: Upload version
      if: ${{ matrix.profile.artifactName == 'nomad_iis' }} # We only need to do this once
      uses: actions/upload-artifact@v4
      with:
        name: version
        path: ./version

    # Publish the application
    - name: Publish the application
      run: dotnet publish "./src/NomadIIS/NomadIIS.csproj" /p:PublishProfile="./src/NomadIIS/Properties/PublishProfiles/${{ matrix.profile.publishProfile }}"

    # Copy to output
    - name: Copy to output folder
      run: |
        mkdir dist
        copy .\src\NomadIIS\bin\Release\net10.0\win-x64\publish\nomad_iis.exe .\dist\nomad_iis.exe

    # Upload the artifact
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.profile.artifactName }}
        path: ./dist

  test:
    runs-on: windows-latest
    needs: ["build"]
    if: ${{ github.event.inputs.release != 'true' }}

    strategy:
      matrix:
        profile:
          - artifactName: "nomad_iis"
          - artifactName: "nomad_iis_mgmt_api"

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # Install the .NET Core workload
    - name: Install .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x

    # Install IIS
    - name: Install IIS
      run: |
        $features = @(
          "IIS-WebServerRole",
          "IIS-WebServer",
          "IIS-CommonHttpFeatures",
          "IIS-HttpErrors",
          "IIS-HttpRedirect",
          "IIS-ApplicationDevelopment",
          "NetFx4Extended-ASPNET45",
          "IIS-NetFxExtensibility45",
          "IIS-HealthAndDiagnostics",
          "IIS-HttpLogging",
          "IIS-LoggingLibraries",
          "IIS-RequestMonitor",
          "IIS-HttpTracing",
          "IIS-Security",
          "IIS-RequestFiltering",
          "IIS-Performance",
          "IIS-WebServerManagementTools",
          "IIS-IIS6ManagementCompatibility",
          "IIS-Metabase",
          "IIS-ManagementConsole",
          "IIS-BasicAuthentication",
          "IIS-WindowsAuthentication",
          "IIS-StaticContent",
          "IIS-DefaultDocument",
          "IIS-WebSockets",
          "IIS-ApplicationInit",
          "IIS-ISAPIExtensions",
          "IIS-ISAPIFilter",
          "IIS-HttpCompressionStatic",
          "IIS-ASP",
          "IIS-ServerSideIncludes",
          "IIS-ASPNET45"
        )
        Enable-WindowsOptionalFeature -Online -FeatureName $features

    # Download Nomad
    - name: Run setup.ps1
      shell: pwsh
      run: .\setup.ps1
    
    # Download nomad_iis.exe
    - uses: actions/download-artifact@master
      with:
        name: ${{ matrix.profile.artifactName }}
        path: artifacts

    - name: Run tests
      env:
        RUNNING_IN_CI: true
        TEST_PLUGIN_DIRECTORY: ..\..\..\..\..\artifacts # Relative to bin\Debug\net10.0
      run: |
        $args = ''
        if ('${{ matrix.profile.artifactName }}' -eq 'nomad_iis_mgmt_api') {
          $args = '-p:DefineConstants="MANAGEMENT_API"'
        }
        dotnet test src\NomadIIS.Tests\NomadIIS.Tests.csproj ${args} --logger "console;verbosity=detailed"

  release:
    runs-on: ubuntu-latest
    needs: ["build"]
    if: ${{ github.event.inputs.release == 'true' }}

    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # Download artifacts produced by the build job above
    - uses: actions/download-artifact@v4
      with:
        name: version
        path: version # Note: This downloads into a folder "version"
    - uses: actions/download-artifact@v4
      with:
        name: nomad_iis
        path: nomad_iis
    - uses: actions/download-artifact@v4
      with:
        name: nomad_iis_mgmt_api
        path: nomad_iis_mgmt_api

    # Read version
    - name: read and verify version
      run: |
        version=`cat ./version/version`
        echo "Release Version: ${{ github.event.inputs.version }}"
        echo "Version in Build: ${version}"

        if [ "${{ github.event.inputs.version }}" != "${version}" ]
        then
          echo "The specified release version doesn't match the version in the build. Please update PluginInfo.cs first."
          exit 1
        fi

    # Zip the artifacts
    - uses: ./.github/actions/action-zip
      with:
        files: ./nomad_iis
        dest: nomad_iis.zip
    - uses: ./.github/actions/action-zip
      with:
        files: ./nomad_iis_mgmt_api
        dest: nomad_iis_mgmt_api.zip

    # Create the Release
    - name: create release
      uses: ./.github/actions/action-gh-release
      with:
        name: v${{ github.event.inputs.version }}
        tag_name: v${{ github.event.inputs.version }}
        draft: true
        files: |
          nomad_iis.zip
          nomad_iis_mgmt_api.zip
